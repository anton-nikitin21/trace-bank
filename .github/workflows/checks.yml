name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m unittest discover -s app -v
      - run: python scripts/check_project.py
      - run: node scripts/test_browser_engine.cjs
      - run: python scripts/build_workspace.py --check
      - run: python scripts/build_preview.py --check
      - run: node scripts/test_auth.cjs
      - run: npm ci --ignore-scripts
      - run: npm run test:documents
